# Publica o Residência Planner no GitHub Pages a cada push na branch padrão.
# Pré-requisito (uma vez): Settings → Pages → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/confident-bell-0pj7j0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes dos algoritmos
        run: npm run test:unit
      - name: Build
        run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Opcional: variáveis do repositório (Settings → Secrets and variables → Actions → Variables)
      # substituem web/public/config.json. A anon key do Supabase é pública por design.
      - name: Configuração do Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            printf '{"supabaseUrl":"%s","supabaseAnonKey":"%s"}\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > dist/config.json
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
